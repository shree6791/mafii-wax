openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /services:
    get:
      operationId: listServices
      responses:
        "200":
          description: Service menu
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
  /appointment-requests:
    post:
      operationId: createAppointmentRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentInput" }
      responses:
        "201":
          description: Request saved, not a confirmed appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    Service:
      type: object
      required: [id, name, category, description, price, duration]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        price: { type: ["number", "null"] }
        duration: { type: ["integer", "null"] }
    AppointmentInput:
      type: object
      required: [serviceId, name, email, preferredDate, preferredTime, consent]
      properties:
        serviceId: { type: string, minLength: 1 }
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        preferredDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        preferredTime: { type: string, enum: [morning, afternoon, evening] }
        consent: { type: boolean }
        source: { type: string, maxLength: 80 }
    Receipt:
      type: object
      required: [reference, status, message]
      properties:
        reference: { type: string }
        status: { type: string }
        message: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status


kind = "web"
previewPath = "/"
title = "MAFII Wax Studio"
description = "Inclusive Mountain View waxing studio website and on-site appointment requests."
version = "1.0.0"
id = "artifacts/mafii"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23894

[services.development]
run = "pnpm --filter @workspace/mafii run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mafii", "run", "build" ]
serve = "static"
publicDir = "artifacts/mafii/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23894"
BASE_PATH = "/"
